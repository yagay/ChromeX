plugins {
    id 'com.android.application'
}

def ciRunText = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').replaceAll('[^0-9]', '')
def ciRun = ciRunText ? ciRunText.toInteger() : 0
def gitSha = System.getenv('GITHUB_SHA') ?: 'local'
def shortSha = gitSha.length() > 12 ? gitSha.substring(0, 12) : gitSha

android {
    namespace 'com.yagay.chromex'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'com.yagay.chromex'
        minSdk 31
        targetSdk 37
        versionCode 1000 + ciRun
        versionName "1.1.${ciRun}"
        buildConfigField 'String', 'BUILD_SHA', "\"${shortSha}\""
        buildConfigField 'String', 'BUILD_RUN', "\"${ciRun}\""

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -fvisibility=hidden -fno-exceptions -fno-rtti'
            }
        }
    }

    buildFeatures {
        buildConfig true
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libshadowhook.so', '**/libshadowhook_nothing.so']
        }
        resources {
            merges += 'META-INF/xposed/*'
        }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'org.luckypray:dexkit:2.2.0'
    implementation 'com.bytedance.android:shadowhook:2.0.1'
    testImplementation 'junit:junit:4.13.2'
}
